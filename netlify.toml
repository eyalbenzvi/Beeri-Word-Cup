[build]
  command = "npm run build"
  publish = "dist"
  ignore = "git diff --quiet HEAD^ HEAD -- src/ public/ netlify/ index.html package.json"

[functions]
  node_bundler = "esbuild"

# Pretty URL for shared blog links — forwards to the OG function which
# injects Open Graph meta tags so WhatsApp / Slack unfurls look like posts,
# then redirects the human reader to the SPA.
[[redirects]]
  from = "/blog/:n"
  to = "/.netlify/functions/og-summary?n=:n"
  status = 200
  force = true

# Same-origin Firebase Auth handler proxy.
#
# These forward the Firebase OAuth helper endpoints to the project's
# firebaseapp.com origin while keeping the URL on OUR domain. That lets us set
# VITE_FIREBASE_AUTH_DOMAIN to this host so the sign-in handshake is same-origin
# — which is what fixes the iOS WebKit storage-partition failure (Chrome-iOS
# renderer crash on Google sign-in). Harmless until that env var is set: the
# SDK only requests these paths when authDomain points here.
# See: https://firebase.google.com/docs/auth/web/redirect-best-practices
[[redirects]]
  from = "/__/auth/*"
  to = "https://beeri-world-cup.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/__/firebase/*"
  to = "https://beeri-world-cup.firebaseapp.com/__/firebase/:splat"
  status = 200
  force = true
